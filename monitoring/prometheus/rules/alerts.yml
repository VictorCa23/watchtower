groups:
  - name: watchtower-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[1m]))
            /
            sum(rate(http_requests_total[1m]))
          ) > 0.10
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate detected"
          description: "More than 10% of requests are returning 5xx errors."

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, route)
          ) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High latency on route {{ $labels.route }}"
          description: "95th percentile latency is above 1s."

      - alert: BackendDown
        expr: up{job="watchtower-backend"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "WatchTower backend is down"
          description: "The backend has been unreachable for more than 15s."
